<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unlock The Little Door</title>
  <link rel="icon" type="image/png" href="assets/Logo.png">

  <style>
    @font-face { font-family: 'Vamp'; src: url('assets/Fonts/Vampire Zone.ttf') format('truetype'); }
    @font-face { font-family: 'Cor'; src: url('assets/Fonts/coraline regular.ttf') format('truetype'); }

    :root {
      --title: "Vamp", sans-serif;
      --body: "Cor", sans-serif;

      --night: #120e2b;
      --plum: #2a1d5e;
      --lilac: #b9a6ff;
      --butter: #ffd76a;
      --mist: #efeaff;
      --blue: #2152e0;
      --indigo: #4a35d6;

      --bg-phone: url("assets/Backgrounds/BG 1 Verti.png");
      --bg-desktop: url("assets/Backgrounds/BG 1 Horti 169.png");
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: var(--body);
      font-weight: 500;
      line-height: 1.5;
      color: var(--mist);
      background-color: var(--night);
      padding:
        calc(84px + env(safe-area-inset-top, 0px))
        18px
        calc(36px + env(safe-area-inset-bottom, 0px));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      height: 100lvh;
      z-index: -2;
      pointer-events: none;
      background-image: var(--bg-phone);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .stars i {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      animation: tw 3s ease-in-out infinite;
    }

    @keyframes tw {
      50% { opacity: .15; transform: scale(.6); }
    }

    :focus-visible {
      outline: 3px solid var(--butter);
      outline-offset: 3px;
      border-radius: 8px;
    }

    .logo {
      position: fixed;
      left: 10px;
      top: calc(8px + env(safe-area-inset-top, 0px));
      z-index: 30;
      display: block;
      font-family: var(--title);
      font-size: 18px;
      color: var(--butter);
      text-decoration: none;
    }

    .logo img {
      display: block;
      height: 58px;
      width: auto;
      transition: transform .3s cubic-bezier(.3, 1.7, .5, 1);
    }

    .logo:hover img,
    .logo:active img {
      transform: rotate(-8deg) scale(1.1);
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: var(--title);
      font-weight: 200;
      font-size: clamp(28px, 9vw, 44px);
      line-height: 1.05;
      color: var(--butter);
      -webkit-text-stroke: 3px #162e9c;
      paint-order: stroke fill;
      text-shadow: 0 4px 0 #1a3a8f;
    }

    .sub {
      max-width: 44ch;
      margin: 10px auto 14px;
      font-size: 15px;
      color: #d8d0ff;
    }

    .timer {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      padding: 5px 16px;
      border-radius: 999px;
      background: var(--mist);
      color: var(--night);
      font-weight: 800;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 3px 0 var(--plum), 0 8px 14px rgba(0, 0, 0, .3);
    }

    .timer b {
      min-width: 3.2ch;
      text-align: left;
      color: var(--indigo);
    }

    body.done .timer {
      background: var(--butter);
    }

    .frame {
      position: relative;
      width: 100%;
    }

    .table {
      position: relative;
      width: 100%;
      height: min(65vh, 720px);
      height: min(65svh, 720px);
      min-height: 400px;
      overflow: hidden;
      border: 3px solid var(--butter);
      border-radius: 16px;
      background: linear-gradient(170deg, rgba(185, 166, 255, .70), rgba(42, 29, 94, .60) 60%);
      box-shadow:
        0 0 0 5px rgba(170, 130, 255, .4),
        inset 0 0 50px rgba(185, 166, 255, .35),
        0 14px 26px rgba(0, 0, 0, .35);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      cursor: grab;
    }

    .table.dragging {
      cursor: grabbing;
    }

    .btn-corner {
      position: absolute;
      z-index: 6;
      width: 34px;
      height: 34px;
      pointer-events: none;
      filter: drop-shadow(0 4px 5px rgba(0, 0, 0, .4));
    }

    .btn-corner img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .btn-corner.tl { top: -13px; left: -13px; }
    .btn-corner.tr { top: -13px; right: -13px; }
    .btn-corner.bl { bottom: -13px; left: -13px; }
    .btn-corner.br { bottom: -13px; right: -13px; }

    .slot {
      position: absolute;
      z-index: 0;
      border-radius: 4px;
      outline: 3px dashed rgba(255, 215, 106, .8);
      outline-offset: 4px;
      background: rgba(18, 14, 43, .35) center / 100% 100% no-repeat;
      pointer-events: none;
    }

    .piece {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .5));
      transition: filter .2s;
    }

    .piece.drag {
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, .55));
    }

    .piece.locked {
      filter: none;
    }

    .table.done .piece {
      opacity: 0;
      transition: opacity .7s ease .25s;
    }

    .table.done .slot {
      outline-color: transparent;
      transition: outline-color .7s;
    }

    .table.done {
      box-shadow:
        0 0 0 5px rgba(170, 130, 255, .4),
        inset 0 0 50px rgba(185, 166, 255, .35),
        0 0 46px rgba(255, 215, 106, .55),
        0 14px 26px rgba(0, 0, 0, .35);
      transition: height .6s ease .4s;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (min-width: 700px) {
      body {
        padding:
          calc(120px + env(safe-area-inset-top, 0px))
          24px
          calc(50px + env(safe-area-inset-bottom, 0px));
      }

      .logo {
        left: 28px;
        top: calc(18px + env(safe-area-inset-top, 0px));
      }

      .logo img {
        height: 100px;
      }

      h1 {
        font-size: clamp(36px, 5vw, 48px);
        -webkit-text-stroke: 4px #162e9c;
        text-shadow: 0 5px 0 #1a3a8f;
      }

      .sub {
        max-width: 60ch;
        margin: 14px auto 18px;
        font-size: 17px;
      }

      .timer {
        margin-bottom: 26px;
        padding: 6px 18px;
        font-size: 1.05rem;
      }

      .table {
        height: min(60vh, 560px);
        height: min(60svh, 560px);
        border-width: 4px;
        border-radius: 20px;
      }

      .btn-corner {
        width: 46px;
        height: 46px;
      }

      .btn-corner.tl { top: -22px; left: -22px; }
      .btn-corner.tr { top: -22px; right: -22px; }
      .btn-corner.bl { bottom: -22px; left: -22px; }
      .btn-corner.br { bottom: -22px; right: -22px; }
    }

    @media (min-width: 900px) {
      :root {
        --bg-phone: var(--bg-desktop);
      }
    }
    
    @media (max-width: 699px) {
      body {
        padding:
          calc(64px + env(safe-area-inset-top, 0px))
          14px
          calc(14px + env(safe-area-inset-bottom, 0px));
      }

      .logo img {
        height: 46px;
      }

      h1 {
        font-size: clamp(22px, 6.8vw, 28px);
        -webkit-text-stroke: 2px #162e9c;
        text-shadow: 0 3px 0 #1a3a8f;
      }

      .sub {
        margin: 6px auto 10px;
        font-size: 12.5px;
        line-height: 1.35;
      }

      .timer {
        margin-bottom: 10px;
        padding: 3px 12px;
        font-size: .9rem;
      }

      .table {
        height: calc(100vh - 235px);
        height: calc(100svh - 235px);
        min-height: 340px;
      }

      .btn-corner {
        width: 28px;
        height: 28px;
      }

      .btn-corner.tl { top: -11px; left: -11px; }
      .btn-corner.tr { top: -11px; right: -11px; }
      .btn-corner.bl { bottom: -11px; left: -11px; }
      .btn-corner.br { bottom: -11px; right: -11px; }
    }
  </style>
</head>

<body>
  <div class="stars" id="stars"></div>

  <a class="logo" id="logo" href="#" aria-label="Mirrors of Midnight">
    <img src="assets/Logo.png" alt="Mirrors of Midnight">
  </a>

  <main>
    <h1>Unlock The Little Door</h1>
    <p class="sub">The little door is locked. The tunnel behind it only opens for those who can solve the puzzle. Unlock it to reveal the Pink Palace floor plan, where every room holds the hint for your perusal before Moving Day.</p>

    <p class="timer">Time <b id="time">0:00</b></p>

    <div class="frame" id="frame">
      <div class="table" id="table">
        <div class="slot" id="slot"></div>
      </div>
    </div>
  </main>

  <script>
    const PHOTO_SRC = 'assets/Unlock The Little Door.png';

    const CORNER_BUTTONS = [
      'assets/Button_Pink.png',
      'assets/Button_Blue.png',
      'assets/Button_Purple.png',
      'assets/Button_Yellow.png'
    ];

    const N = 4;
    const TOTAL = N * N;
    const SNAP = 0.35;
    const PAD_RATIO = 0.36;
    const GAP = 18;

    const table = document.getElementById('table');
    const slot = document.getElementById('slot');
    const timeEl = document.getElementById('time');
    const hitCtx = document.createElement('canvas').getContext('2d');

    let source = null;
    let pieces = [];
    let drag = null;
    let zTop = 100;
    let done = false;
    let startTime = 0;
    let timerId = null;

    let W = 0, H = 0;
    let S = 0, s = 0, pad = 0;
    let bx = 0, by = 0;

    (function makeStars() {
      const box = document.getElementById('stars');
      for (let i = 0; i < 60; i++) {
        const d = document.createElement('i');
        d.style.cssText =
          'left:' + Math.random() * 100 + '%;' +
          'top:' + Math.random() * 100 + '%;' +
          'animation-delay:' + Math.random() * 3 + 's;' +
          'transform:scale(' + (0.6 + Math.random()) + ')';
        box.appendChild(d);
      }
    })();

    (function makeCornerButtons() {
      const frame = document.getElementById('frame');
      ['tl', 'tr', 'bl', 'br'].forEach((pos, i) => {
        const im = new Image();
        im.alt = '';
        im.draggable = false;
        im.onload = () => {
          const wrap = document.createElement('span');
          wrap.className = 'btn-corner ' + pos;
          wrap.appendChild(im);
          frame.appendChild(wrap);
        };
        im.src = CORNER_BUTTONS[i];
      });
    })();

    function fmt(ms) {
      const sec = Math.floor(ms / 1000);
      return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }

    function tick() {
      timeEl.textContent = fmt(Date.now() - startTime);
    }

    function startTimer() {
      if (startTime) return;
      startTime = Date.now();
      timerId = setInterval(tick, 250);
    }

    function stopTimer() {
      clearInterval(timerId);
      tick();
    }

    function squareCrop(img) {
      const c = document.createElement('canvas');
      c.width = c.height = 1000;

      const scale = Math.max(1000 / img.width, 1000 / img.height);
      const w = img.width * scale;
      const h = img.height * scale;

      c.getContext('2d').drawImage(img, (1000 - w) / 2, (1000 - h) / 2, w, h);
      return c;
    }

    const KNOB = [
      [0.42, 0.00, 0.40, 0.10, 0.38, 0.14],
      [0.26, 0.22, 0.32, 0.32, 0.50, 0.32],
      [0.68, 0.32, 0.74, 0.22, 0.62, 0.14],
      [0.60, 0.10, 0.58, 0.00, 0.66, 0.00]
    ];

    function makeTabs() {
      const tabs = Array.from({ length: TOTAL }, () => ({ top: 0, right: 0, bottom: 0, left: 0 }));

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const id = r * N + c;

          if (c < N - 1) {
            const t = Math.random() < .5 ? 1 : -1;
            tabs[id].right = t;
            tabs[id + 1].left = -t;
          }
          if (r < N - 1) {
            const t = Math.random() < .5 ? 1 : -1;
            tabs[id].bottom = t;
            tabs[id + N].top = -t;
          }
        }
      }
      return tabs;
    }

    function buildPath(tabs) {
      const path = new Path2D();
      const corners = [
        [pad, pad],
        [pad + s, pad],
        [pad + s, pad + s],
        [pad, pad + s]
      ];
      const types = [tabs.top, tabs.right, tabs.bottom, tabs.left];

      path.moveTo(corners[0][0], corners[0][1]);

      for (let k = 0; k < 4; k++) {
        const [ax, ay] = corners[k];
        const [ex, ey] = corners[(k + 1) % 4];
        const type = types[k];

        if (type === 0) {
          path.lineTo(ex, ey);
          continue;
        }

        const dx = (ex - ax) / s;
        const dy = (ey - ay) / s;
        const nx = dy;
        const ny = -dx;

        const P = (u, v) => [
          ax + dx * u * s + nx * v * s * type,
          ay + dy * u * s + ny * v * s * type
        ];

        path.lineTo(...P(0.34, 0));
        KNOB.forEach(q => {
          path.bezierCurveTo(...P(q[0], q[1]), ...P(q[2], q[3]), ...P(q[4], q[5]));
        });
        path.lineTo(ex, ey);
      }

      path.closePath();
      return path;
    }

    function drawPiece(p) {
      const dpr = window.devicePixelRatio || 1;
      const size = s + pad * 2;
      const cv = p.canvas;

      cv.width = Math.round(size * dpr);
      cv.height = Math.round(size * dpr);
      cv.style.width = size + 'px';
      cv.style.height = size + 'px';

      const ctx = cv.getContext('2d');
      ctx.scale(dpr, dpr);

      ctx.save();
      ctx.clip(p.path);
      ctx.drawImage(source, pad - p.c * s, pad - p.r * s, S, S);

      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255, 255, 255, .22)';
      ctx.stroke(p.path);
      ctx.restore();

      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(18, 14, 43, .6)';
      ctx.stroke(p.path);
    }

    const correctX = p => bx + p.c * s - pad;
    const correctY = p => by + p.r * s - pad;

    function place(p) {
      const size = s + pad * 2;

      if (p.locked) {
        p.x = correctX(p);
        p.y = correctY(p);
      } else {
        p.x = p.fx * (W - size);
        p.y = p.fy * (H - size);
      }

      p.canvas.style.left = p.x + 'px';
      p.canvas.style.top = p.y + 'px';
    }
    
    function fitCard() {
      const border = table.offsetHeight - table.clientHeight;
      table.style.minHeight = '0';
      table.style.height = (S + GAP * 2 + border) + 'px';
      slot.style.top = by + 'px';
    }
    
    function layout() {
      W = table.clientWidth;
      H = table.clientHeight;

      if (done) {
        S = Math.min(W * 0.86, 480);
        by = GAP;
      } else if (H > W * 0.9) {
        S = Math.min(W * 0.86, H * 0.55, 480);
        by = 18;
      } else {
        S = Math.min(W * 0.5, H * 0.7, 480);
        by = (H - S) / 2;
      }

      s = S / N;
      pad = s * PAD_RATIO;
      bx = (W - S) / 2;

      slot.style.left = bx + 'px';
      slot.style.top = by + 'px';
      slot.style.width = S + 'px';
      slot.style.height = S + 'px';

      pieces.forEach(p => {
        p.path = buildPath(p.tabs);
        drawPiece(p);
        place(p);
      });
      if (done) fitCard();
    }

    function scatter(p) {
      const size = s + pad * 2;
      const m = s * 0.5;

      for (let i = 0; i < 80; i++) {
        p.fx = Math.random();
        p.fy = Math.random();

        const cx = p.fx * (W - size) + size / 2;
        const cy = p.fy * (H - size) + size / 2;

        const outside =
          cx < bx - m || cx > bx + S + m ||
          cy < by - m || cy > by + S + m;

        if (outside) break;
      }
    }

    function start() {
      const tabs = makeTabs();

      for (let id = 0; id < TOTAL; id++) {
        const canvas = document.createElement('canvas');
        canvas.className = 'piece';
        canvas.style.zIndex = 10 + id;
        table.appendChild(canvas);

        pieces.push({
          id,
          r: Math.floor(id / N),
          c: id % N,
          tabs: tabs[id],
          canvas,
          path: null,
          x: 0,
          y: 0,
          fx: .5,
          fy: .5,
          z: 10 + id,
          locked: false
        });
      }

      layout();
      pieces.forEach(scatter);
      pieces.forEach(place);
    }

    function point(e) {
      const rect = table.getBoundingClientRect();
      return [
        e.clientX - rect.left - table.clientLeft,
        e.clientY - rect.top - table.clientTop
      ];
    }

    function moveTo(p, x, y) {
      const size = s + pad * 2;

      p.x = Math.max(0, Math.min(W - size, x));
      p.y = Math.max(0, Math.min(H - size, y));
      p.fx = p.x / (W - size);
      p.fy = p.y / (H - size);

      p.canvas.style.left = p.x + 'px';
      p.canvas.style.top = p.y + 'px';
    }

    table.addEventListener('pointerdown', e => {
      if (done) return;

      const [px, py] = point(e);
      const free = pieces.filter(p => !p.locked).sort((a, b) => b.z - a.z);

      let hit = free.find(p => hitCtx.isPointInPath(p.path, px - p.x, py - p.y));

      if (!hit) {
        hit = free.find(p =>
          px >= p.x + pad && px <= p.x + pad + s &&
          py >= p.y + pad && py <= p.y + pad + s
        );
      }

      if (!hit) return;

      e.preventDefault();
      startTimer();
      table.setPointerCapture(e.pointerId);
      table.classList.add('dragging');

      hit.z = ++zTop;
      hit.canvas.style.zIndex = hit.z;
      hit.canvas.classList.add('drag');

      const lift = e.pointerType === 'touch' ? s * 0.45 : 0;

      drag = { p: hit, dx: px - hit.x, dy: py - hit.y, lift };
      moveTo(hit, px - drag.dx, py - drag.dy - lift);
    });

    table.addEventListener('pointermove', e => {
      if (!drag) return;

      const [px, py] = point(e);
      moveTo(drag.p, px - drag.dx, py - drag.dy - drag.lift);
    });

    function drop() {
      if (!drag) return;

      const p = drag.p;
      drag = null;

      table.classList.remove('dragging');
      p.canvas.classList.remove('drag');

      if (Math.hypot(p.x - correctX(p), p.y - correctY(p)) < s * SNAP) {
        p.locked = true;
        p.z = 1;
        p.canvas.style.zIndex = 1;
        p.canvas.classList.add('locked');
        place(p);
        checkWin();
      }
    }

    table.addEventListener('pointerup', drop);
    table.addEventListener('pointercancel', drop);

    let resizeTimer;
    addEventListener('resize', () => {
      if (!drag && pieces.length) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(layout, 100);
      }
    });

    function checkWin() {
      if (!pieces.every(p => p.locked)) return;

      done = true;
      stopTimer();
      slot.style.backgroundImage = `url(${source.toDataURL('image/jpeg', .9)})`;
      table.classList.add('done');
      document.body.classList.add('done');
      
      by = GAP;
      fitCard();
    }

    const img = new Image();

    img.onload = () => {
      source = squareCrop(img);
      start();
    };

    img.onerror = () => {
      console.error('Foto tidak ditemukan:', PHOTO_SRC);
    };

    img.src = PHOTO_SRC;
  </script>
</body>

</html>
